name: macOS v2 checks and package

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-macos:
    name: Native Swift build and checks
    # swift-testing 6.3.2 requires Swift tools 6.2 or newer. The macOS 15
    # image currently exposes Swift 6.1, while macOS 26 carries current Xcode.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show Swift toolchain
        run: swift --version

      - name: Run Swift core checks
        run: bash scripts/run_swift_checks.sh

      - name: Build native app
        run: bash scripts/build_app.sh

      - name: Verify app bundle
        run: bash scripts/verify_app.sh

      - name: Build non-publishing macOS release candidate
        if: github.event_name != 'pull_request'
        run: python3 scripts/build_macos_release.py --version 2.0.0 --release-label beta.1

      - name: Upload macOS release candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SZU-Campus-Network-macOS-v2.0.0-beta.1
          path: |
            dist/release/SZU-Campus-Network-macOS-v2.0.0-beta.1.zip
            dist/release/SZU-Campus-Network-macOS-v2.0.0-beta.1.zip.sha256
          if-no-files-found: error
          retention-days: 30
