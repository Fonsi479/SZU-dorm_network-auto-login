name: macOS Swift

on:
  push:
    branches: [macswift]
  pull_request:
    branches: [main, macswift]

permissions:
  contents: read

jobs:
  native-macos:
    name: Native Swift build and checks
    # macOS 14 runners default to Xcode 15 / Swift 5.10, while Package.swift
    # requires Swift tools 6.0. macOS 15 runners provide Xcode 16 / Swift 6.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out macOS branch
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run Swift core checks
        run: bash scripts/run_swift_checks.sh

      - name: Build native app
        run: bash scripts/build_app.sh

      - name: Verify app bundle
        run: bash scripts/verify_app.sh
