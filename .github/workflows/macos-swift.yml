name: macOS Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-macos:
    name: Native Swift build and checks
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out macOS branch
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run Swift core checks
        run: bash scripts/run_swift_checks.sh

      - name: Build native app
        run: bash scripts/build_app.sh

      - name: Verify app bundle
        run: bash scripts/verify_app.sh
