name: Windows client checks

on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests and Tk smoke test
        env:
          SZU_RUN_TK_SMOKE: "1"
        run: python -m unittest discover -s tests

      - name: Verify Windows-only source boundary
        run: python scripts/verify_windows_package.py

      - name: Assemble and verify transfer zip
        run: |
          python scripts/build_windows_package.py --version ci
          python scripts/verify_windows_package.py --package-root dist/windows-staging/szu-dorm-login-windows-vci
